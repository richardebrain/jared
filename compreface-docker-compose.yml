version: '3.8'
services:
  compreface-postgres-db:
    image: postgres:11.5
    container_name: "compreface-postgres-db"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=frs
    volumes:
      - postgres-data:/var/lib/postgresql/data

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: "compreface-admin"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - ENABLE_EMAIL_SERVER=false
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_USERNAME=
      - EMAIL_FROM=
      - EMAIL_PASSWORD=
      - ADMIN_JAVA_OPTS=-Xmx8g
      - MAX_FILE_SIZE=5MB
      - MAX_REQUEST_SIZE=10MB
    depends_on:
      - compreface-postgres-db
    ports:
      - "8000:8080"

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: "compreface-api"
    restart: always
    depends_on:
      - compreface-postgres-db
      - compreface-admin
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - API_JAVA_OPTS=-Xmx8g
    ports:
      - "8001:8080"

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: "compreface-ui"
    restart: always
    ports:
      - "8002:80"
    depends_on:
      - compreface-api
      - compreface-admin
    environment:
      - API_URL=http://localhost:8000

volumes:
  postgres-data: