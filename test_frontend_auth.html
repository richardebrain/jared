<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Frontend Authentication Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testAuth()">Test Auth Check</button>
    <div id="results"></div>

    <script>
        async function testLogin() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: 'jlcookie20',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                document.getElementById('results').innerHTML = 
                    '<p>Login Response: ' + JSON.stringify(data, null, 2) + '</p>';
            } catch (error) {
                document.getElementById('results').innerHTML = 
                    '<p>Login Error: ' + error.message + '</p>';
            }
        }

        async function testAuth() {
            try {
                const response = await fetch('/api/auth/user', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                document.getElementById('results').innerHTML += 
                    '<p>Auth Check Response: ' + JSON.stringify(data, null, 2) + '</p>';
            } catch (error) {
                document.getElementById('results').innerHTML += 
                    '<p>Auth Check Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
