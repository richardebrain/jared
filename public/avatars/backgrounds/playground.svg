<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="200" height="140" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="160" cy="40" r="20" fill="#FFFF00" stroke="#FFA500" stroke-width="2"/>
  
  <!-- Grass -->
  <rect x="0" y="140" width="200" height="60" fill="#7CFC00"/>
  
  <!-- Slide -->
  <path d="M50,80 L90,140 L70,140 L30,80 Z" fill="#FF5722" stroke="#000000" stroke-width="1"/>
  <rect x="30" y="70" width="20" height="10" fill="#FF5722" stroke="#000000" stroke-width="1"/>
  
  <!-- Swing set frame -->
  <path d="M120,100 L140,140 M160,100 L140,140" fill="none" stroke="#8B4513" stroke-width="4"/>
  <line x1="120" y1="100" x2="160" y2="100" stroke="#8B4513" stroke-width="4"/>
  
  <!-- Swing seat -->
  <rect x="130" y="120" width="20" height="5" fill="#8B4513" stroke="#000000" stroke-width="1"/>
  <line x1="130" y1="120" x2="130" y2="100" stroke="#000000" stroke-width="1"/>
  <line x1="150" y1="120" x2="150" y2="100" stroke="#000000" stroke-width="1"/>
  
  <!-- Clouds -->
  <ellipse cx="40" cy="40" rx="20" ry="10" fill="#FFFFFF"/>
  <ellipse cx="70" cy="30" rx="15" ry="8" fill="#FFFFFF"/>
</svg>