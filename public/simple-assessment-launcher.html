<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MentorMe Assessment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f8ff;
      text-align: center;
    }
    
    .container {
      width: 90%;
      max-width: 600px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      color: #3b82f6;
      margin-top: 0;
    }
    
    p {
      color: #64748b;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }
    
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3b82f6;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MentorMe ECE Assessment</h1>
    <p>Click the button below to start your early childhood education assessment. This will open in a new tab and won't affect your progress in the main application.</p>
    
    <div class="loader" id="loader"></div>
    
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfuKxxqApOXCZmQh5hO9V5-_4bWHgTsA-mxEtCmXHmQCscCdw/viewform" target="_blank" class="btn" id="startBtn">Start Assessment</a>
    
    <p style="margin-top: 30px; font-size: 14px;">
      <a href="/" style="color: #3b82f6; text-decoration: none;">Return to Dashboard</a>
    </p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('startBtn');
      const loader = document.getElementById('loader');
      
      btn.addEventListener('click', function() {
        loader.style.display = 'block';
        
        // This is a very simple approach that's guaranteed to work
        // It just opens the Google Form in a new tab
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSfuKxxqApOXCZmQh5hO9V5-_4bWHgTsA-mxEtCmXHmQCscCdw/viewform', '_blank');
        
        // Hide loader after a short delay
        setTimeout(function() {
          loader.style.display = 'none';
        }, 1000);
      });
    });
  </script>
</body>
</html>
