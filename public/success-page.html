<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Successfully Loaded</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      color: #333;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .container {
      max-width: 600px;
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h1 {
      color: #4a6bfa;
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background-color: #4caf50;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }
    .success-icon::before {
      content: "";
      width: 30px;
      height: 15px;
      border-left: 5px solid white;
      border-bottom: 5px solid white;
      transform: rotate(-45deg) translate(3px, -5px);
    }
    .button {
      display: inline-block;
      background-color: #4a6bfa;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .button:hover {
      background-color: #3a5ae8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon"></div>
    <h1>Assessment Loaded Successfully!</h1>
    <p>Your assessment is now ready. You will be redirected to the appropriate assessment page.</p>
    <p>If you are not redirected automatically, please click the button below:</p>
    <a href="./basic-assessment.html" class="button">Go to Basic Assessment</a>
  </div>

  <script>
    // Redirect to the assessment page after a short delay
    setTimeout(function() {
      window.location.href = "./basic-assessment.html";
    }, 1500);
  </script>
</body>
</html>
