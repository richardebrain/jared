<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECE Knowledge Assessment - Redirecting</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2563eb;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .logo {
      margin-bottom: 30px;
      font-size: 40px;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #2563eb;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🧠</div>
    <h1>ECE Knowledge Assessment</h1>
    <p>You are being redirected to our secure assessment platform...</p>
    <div class="spinner"></div>
    <p>If you are not automatically redirected in 5 seconds, please click the button below:</p>
    <a href="https://forms.gle/W8vgp6UTt2PXpCE67" class="btn" target="_blank">Start Assessment</a>
  </div>

  <script>
    // Redirect after a short delay
    setTimeout(function() {
      window.location.href = "https://forms.gle/W8vgp6UTt2PXpCE67";
    }, 5000);
  </script>
</body>
</html>
