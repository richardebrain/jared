<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="600" fill="#f1f5f9"/>

<!-- Header Navigation -->
<rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
