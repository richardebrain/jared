openapi: 3.0.3
info:
  title: Assessment Administration API
  description: |
    API for managing assessment questions, domains, and system administration in the MentorMe platform.
    
    ## Overview
    This API provides endpoints for administrators to manage the assessment system with the following key features:
    - **Question Management**: CRUD operations for assessment questions with approval workflow
    - **Domain Management**: Domain configuration and statistics tracking
    - **Bulk Operations**: Efficient batch processing of questions
    - **Availability Control**: Platform and school-level question availability management
    - **Admin Security**: Robust authentication and authorization for administrative access
    
    ## Authentication
    All endpoints require admin authentication with either:
    - Session-based authentication with admin role user
    - Admin password parameter (`admin_password=BIGSURF55`) for API access
    
    ## Question Lifecycle
    1. **Creation**: `POST /questions` - Create new question (requires approval)
    2. **Review**: `GET /questions` - List questions with filtering and pagination
    3. **Approval**: `POST /questions/:id/approve` - Approve/reject questions
    4. **Management**: `PUT /questions/:id` - Update question content
    5. **Availability**: `PUT /questions/:id/availability` - Control school-level availability
    6. **Cleanup**: `DELETE /questions/:id` - Remove questions if needed
    
    ## Security Features
    - Admin role validation on all endpoints
    - Comprehensive input validation and sanitization
    - Audit trail for all question modifications
    - Bulk operation safeguards
    
  version: 1.0.0
  contact:
    name: MentorMe API Support
    email: api@mentorme.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/admin
    description: Assessment Administration API base path

security:
  - sessionAuth: []
  - adminPassword: []

tags:
  - name: Question Management
    description: CRUD operations for assessment questions
  - name: Question Approval
    description: Question approval workflow and bulk operations
  - name: Domain Management
    description: Assessment domain configuration and statistics
  - name: Availability Control
    description: School-level question availability management

paths:
  /questions:
    get:
      tags:
        - Question Management
      summary: List questions with filtering and pagination
      description: |
        Retrieve paginated list of assessment questions with comprehensive filtering options.
        Supports search across question text, explanations, and tags.
      parameters:
        - name: admin_password
          in: query
          required: true
          schema:
            type: string
          description: Admin authentication password
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of questions per page
        - name: search
          in: query
          schema:
            type: string
          description: Search across question text, explanations, and tags
        - name: domainId
          in: query
          schema:
            type: string
          description: Filter by domain name
        - name: difficulty
          in: query
          schema:
            type: string
            enum: ["1", "2", "3", "4", "5", "6"]
          description: Filter by difficulty level
        - name: isApproved
          in: query
          schema:
            type: boolean
          description: Filter by approval status
        - name: isEnabled
          in: query
          schema:
            type: boolean
          description: Filter by availability status
        - name: createdBy
          in: query
          schema:
            type: integer
          description: Filter by creator user ID
        - name: sortBy
          in: query
          schema:
            type: string
            enum: ["createdAt", "updatedAt", "difficulty", "isApproved", "isEnabled"]
            default: "createdAt"
          description: Sort field
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "desc"
          description: Sort direction
      responses:
        '200':
          description: Questions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          $ref: '#/components/schemas/QuestionWithMetadata'
                      pagination:
                        $ref: '#/components/schemas/PaginationInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Question Management
      summary: Create new question
      description: |
        Create a new assessment question with auto-generated ID.
        The question ID will be automatically generated in the format: domain-difficulty-sequence
        (e.g., "child-safety-3-001" for a medium difficulty question in Child Safety domain).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admin_password
                - domainId
                - text
                - options
                - correctAnswer
                - difficulty
                - miniLesson
              properties:
                admin_password:
                  type: string
                  description: Admin authentication password
                domainId:
                  type: string
                  description: Domain name (must exist in assessment_domains)
                  example: "Child Safety & Supervision"
                text:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: Question text
                  example: "What is the most important factor when supervising children during outdoor play?"
                options:
                  type: array
                  items:
                    type: string
                  minItems: 4
                  maxItems: 4
                  description: Multiple choice options (exactly 4 required - A, B, C, D)
                  example: ["Call the police immediately", "Ignore the behavior", "Approach the person directly", "Report to a supervisor or authority figure"]
                correctAnswer:
                  type: integer
                  description: Index of the correct answer (0=A, 1=B, 2=C, 3=D)
                  minimum: 0
                  maximum: 3
                  example: 3
                difficulty:
                  type: string
                  enum: ["1", "2", "3", "4", "5", "6"]
                  description: |
                    Difficulty level:
                    - 1: Easy
                    - 2: Easy/Medium
                    - 3: Medium
                    - 4: Medium/Hard
                    - 5: Hard
                    - 6: Master
                  example: "3"
                miniLesson:
                  type: string
                  description: Required educational content for users who get this question wrong
                  minLength: 1
                  example: "Child safety protocols require immediate escalation to trained professionals who can assess the situation and take appropriate action."
                tags:
                  type: string
                  description: Comma-separated tags for categorization (optional)
                  example: "supervision, outdoor play, safety"
      responses:
        '201':
          description: Question created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Question'
                  message:
                    type: string
                    example: "Question created successfully with ID: child-safety-3-001"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Validation error: Correct answer index is out of range for provided options"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/{questionId}:
    get:
      tags:
        - Question Management
      summary: Get Question Details
      description: |
        Retrieves complete details for a specific assessment question including metadata and statistics.
        
        **Information Included:**
        - Complete question content and configuration
        - Domain association and metadata
        - Approval status and workflow history
        - Creator and approver information
        - Performance statistics (response count, correct rate)
        - Availability settings across schools
      operationId: getQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Question details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Question not found"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Question Management
      summary: Update Question
      description: |
        Updates an existing assessment question with comprehensive validation.
        
        **Update Process:**
        - Validates all modified fields
        - Maintains referential integrity with domains
        - Preserves approval status unless explicitly changed
        - Updates modification timestamp and user tracking
        - Handles partial updates (only specified fields changed)
        
        **Approval Impact:**
        If question content is significantly modified, the approval status may be reset requiring re-approval.
      operationId: updateQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionRequest'
            example:
              text: "What is the appropriate adult-to-child ratio for toddlers during outdoor play activities?"
              difficulty: 4
      responses:
        '200':
          description: Question updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
              example:
                success: true
                data:
                  id: "safety-3-001"
                  domainId: "Child Safety & Supervision"
                  text: "What is the appropriate adult-to-child ratio for toddlers during outdoor play activities?"
                  options: ["1:4", "1:6", "1:8", "1:10"]
                  correctAnswer: 0
                  difficulty: 4
                  updatedAt: "2025-01-15T11:45:00.000Z"
                message: "Question updated successfully"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Question Management
      summary: Delete Question
      description: |
        Permanently removes an assessment question from the system.
        
        **Deletion Safeguards:**
        - Checks for existing assessment responses
        - Validates admin permissions for deletion
        - Logs deletion action for audit trail
        - Cannot be undone once completed
        
        **Warning:**
        This operation permanently removes the question and cannot be reversed. Use with caution.
      operationId: deleteQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier to delete
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Question deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Question deleted successfully"
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/{questionId}/approve:
    post:
      tags:
        - Question Approval
      summary: Approve or Reject Question
      description: |
        Updates the approval status of an assessment question in the review workflow.
        
        **Approval Process:**
        - Admin reviews question content and quality
        - Approval enables question for use in assessments
        - Rejection prevents question from appearing in assessments
        - Tracks approval user and timestamp for audit trail
        
        **Impact:**
        - Approved questions become available for adaptive assessment selection
        - Rejected questions remain in system but are excluded from assessments
        - Approval status can be changed multiple times if needed
      operationId: approveQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isApproved
              properties:
                isApproved:
                  type: boolean
                  description: Whether to approve or reject the question
                  example: true
      responses:
        '200':
          description: Question approval status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
              example:
                success: true
                data:
                  id: "safety-3-001"
                  isApproved: true
                  approvedBy: 15
                  updatedAt: "2025-01-15T11:45:00.000Z"
                message: "Question approved successfully"
        '400':
          description: Invalid approval status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "isApproved must be a boolean value"
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/{questionId}/availability:
    put:
      tags:
        - Availability Control
      summary: Update Question Availability
      description: |
        Controls question availability at platform or school level for fine-grained access management.
        
        **Availability Levels:**
        - **Platform Level**: Controls global question availability (schoolId = null)
        - **School Level**: Controls availability for specific schools
        - **Cascading Logic**: School settings override platform settings
        
        **Use Cases:**
        - Disable problematic questions globally
        - Enable pilot questions for specific schools
        - Regional compliance requirements
        - Gradual question rollout strategies
      operationId: updateQuestionAvailability
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isEnabled
              properties:
                isEnabled:
                  type: boolean
                  description: Whether question is available for use
                  example: true
                schoolId:
                  type: integer
                  nullable: true
                  description: School ID for school-specific availability (null for platform-wide)
                  example: 12
      responses:
        '200':
          description: Question availability updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      questionId:
                        type: string
                        example: "safety-3-001"
                      schoolId:
                        type: integer
                        nullable: true
                        example: 12
                      isEnabled:
                        type: boolean
                        example: true
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2025-01-15T11:45:00.000Z"
                  message:
                    type: string
                    example: "Question availability updated successfully"
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/bulk/approve:
    post:
      tags:
        - Question Approval
      summary: Bulk Approve Questions
      description: |
        Efficiently approves multiple questions in a single operation for streamlined workflow management.
        
        **Bulk Processing:**
        - Processes up to 100 questions per request
        - Validates each question ID before processing
        - Atomic operation - all questions processed or none
        - Returns count of successfully updated questions
        - Comprehensive error handling for partial failures
        
        **Performance:**
        Optimized for high-volume approval workflows with database transactions and batch processing.
      operationId: bulkApproveQuestions
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionIds
              properties:
                questionIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Array of question IDs to approve
                  example: ["safety-3-001", "safety-3-002", "health-2-015"]
      responses:
        '200':
          description: Questions approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updatedCount:
                        type: integer
                        description: Number of questions successfully approved
                        example: 3
                  message:
                    type: string
                    example: "3 questions approved successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "questionIds must be a non-empty array"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/bulk/availability:
    post:
      tags:
        - Availability Control
      summary: Bulk Update Question Availability
      description: |
        Updates availability status for multiple questions simultaneously for efficient system management.
        
        **Bulk Availability Management:**
        - Process up to 100 questions per request
        - Apply consistent availability settings across question sets
        - Support both platform-wide and school-specific updates
        - Atomic transaction processing for data consistency
        
        **Use Cases:**
        - Seasonal question activation/deactivation
        - Regional compliance updates
        - Emergency question disabling
        - Pilot program management
      operationId: bulkUpdateAvailability
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionIds
                - isEnabled
              properties:
                questionIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Array of question IDs to update
                  example: ["safety-3-001", "safety-3-002", "health-2-015"]
                isEnabled:
                  type: boolean
                  description: Whether questions should be enabled
                  example: true
                schoolId:
                  type: integer
                  nullable: true
                  description: School ID for school-specific updates (null for platform-wide)
                  example: 12
      responses:
        '200':
          description: Question availability updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updatedCount:
                        type: integer
                        description: Number of questions successfully updated
                        example: 3
                  message:
                    type: string
                    example: "3 questions availability updated successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /domains:
    get:
      tags:
        - Domain Management
      summary: Get Assessment Domains
      description: |
        Retrieves all active assessment domains used for question categorization and weighted selection.
        
        **Domain Information:**
        - Complete domain metadata and descriptions
        - Question weight configurations for adaptive assessment
        - Display ordering for UI presentation
        - Domain activation status
        
        **Usage:**
        Used by question management interfaces and assessment configuration systems.
      operationId: getDomains
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Domains retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssessmentDomain'
                    example:
                      - id: 1
                        name: "Child Safety & Supervision"
                        description: "Active supervision, incident response, hygiene, emergency plans"
                        questionWeight: 10
                        displayOrder: 1
                        isActive: true
                        createdAt: "2025-01-15T10:00:00.000Z"
                        updatedAt: "2025-01-15T10:00:00.000Z"
                      - id: 2
                        name: "Health & Development"
                        description: "Developmental milestones, nutrition, sleep, red flags"
                        questionWeight: 8
                        displayOrder: 2
                        isActive: true
                        createdAt: "2025-01-15T10:00:00.000Z"
                        updatedAt: "2025-01-15T10:00:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /domains/statistics:
    get:
      tags:
        - Domain Management
      summary: Get Domain Statistics
      description: |
        Retrieves comprehensive statistics for assessment domains including question counts and approval metrics.
        
        **Statistics Included:**
        - Total questions per domain
        - Approved questions count
        - Approval percentage rates
        - Domain configuration metadata
        
        **Use Cases:**
        - Content gap analysis
        - Quality assurance monitoring
        - Domain balance assessment
        - Content planning and strategy
      operationId: getDomainStatistics
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Domain statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/AssessmentDomain'
                        - type: object
                          properties:
                            questionCount:
                              type: integer
                              description: Total questions in this domain
                              example: 45
                            approvedCount:
                              type: integer
                              description: Number of approved questions
                              example: 38
                    example:
                      - id: 1
                        name: "Child Safety & Supervision"
                        description: "Active supervision, incident response, hygiene, emergency plans"
                        questionWeight: 10
                        displayOrder: 1
                        isActive: true
                        questionCount: 45
                        approvedCount: 38
                      - id: 2
                        name: "Health & Development"
                        description: "Developmental milestones, nutrition, sleep, red flags"
                        questionWeight: 8
                        displayOrder: 2
                        isActive: true
                        questionCount: 32
                        approvedCount: 29
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session-based authentication cookie
    adminPassword:
      type: apiKey
      in: query
      name: admin_password
      description: Admin password for API access

  schemas:
    AssessmentDomain:
      type: object
      properties:
        id:
          type: integer
          description: Unique domain identifier
          example: 1
        name:
          type: string
          description: Domain name
          example: "Child Safety & Supervision"
        description:
          type: string
          description: Domain description
          example: "Active supervision, incident response, hygiene, emergency plans"
        questionWeight:
          type: integer
          description: Relative weight for question selection
          example: 10
        displayOrder:
          type: integer
          description: Order for display purposes
          example: 1
        isActive:
          type: boolean
          description: Whether domain is active
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-01-15T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-01-15T10:00:00.000Z"

    AssessmentQuestion:
      type: object
      properties:
        id:
          type: string
          description: Auto-generated unique question identifier (format: domain-difficulty-sequence)
          example: "child-safety-3-001"
        domainId:
          type: string
          description: Associated domain name
          example: "Child Safety & Supervision"
        text:
          type: string
          description: Question text
          example: "What is the appropriate adult-to-child ratio for toddlers?"
        options:
          type: array
          items:
            type: string
          description: Answer options
          example: ["1:4", "1:6", "1:8", "1:10"]
        correctAnswer:
          type: integer
          description: Index of correct answer (0-based)
          example: 0
        difficulty:
          type: integer
          minimum: 1
          maximum: 6
          description: Difficulty level (1=Easy, 6=Master)
          example: 3
        explanation:
          type: string
          nullable: true
          description: Explanation for correct answer
          example: "Toddlers require closer supervision due to their developmental stage."
        miniLesson:
          type: string
          nullable: true
          description: Educational content for this topic
          example: "Understanding supervision ratios ensures child safety..."
        tags:
          type: array
          items:
            type: string
          nullable: true
          description: Additional categorization tags
          example: ["supervision", "ratios", "outdoor-play"]
        createdBy:
          type: integer
          nullable: true
          description: User ID who created the question
          example: 12
        approvedBy:
          type: integer
          nullable: true
          description: User ID who approved the question
          example: 15
        isApproved:
          type: boolean
          description: Whether question is approved for use
          example: true
        isEnabled:
          type: boolean
          description: Whether question is enabled
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-01-15T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-01-15T10:30:00.000Z"
        domainName:
          type: string
          nullable: true
