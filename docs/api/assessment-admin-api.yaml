    CreateQuestionRequest:
      type: object
      required:
        - domainId
        - text
        - options
        - correctAnswer
        - difficulty
        - miniLesson
      properties:
        domainId:
          type: string
          description: ID of the assessment domain
          example: "child-safety"
        text:
          type: string
          description: The question text
          minLength: 10
          maxLength: 500
          example: "What should you do if you see someone acting suspiciously around children?"
        options:
          type: array
          items:
            type: string
          description: Multiple choice options (exactly 4 required - A, B, C, D)
          minItems: 4
          maxItems: 4
          example: ["Call the police immediately", "Ignore the behavior", "Approach the person directly", "Report to a supervisor or authority figure"]
        correctAnswer:
          type: integer
          description: Index of the correct answer (0=A, 1=B, 2=C, 3=D)
          minimum: 0
          maximum: 3
          example: 3
        difficulty:
          type: string
          description: Question difficulty level
          enum: ["1", "2", "3", "4", "5"]
          example: "3"
        miniLesson:
          type: string
          description: Required educational content for users who get this question wrong
          minLength: 1
          example: "Child safety protocols require immediate escalation to trained professionals who can assess the situation and take appropriate action."
        explanation:
          type: string
          description: Optional explanation of the correct answer
          example: "Reporting to appropriate authorities ensures proper handling while maintaining safety protocols."
        tags:
          type: string
          description: Optional comma-separated tags
          example: "safety,reporting,protocols"

