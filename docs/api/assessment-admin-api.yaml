openapi: 3.0.3
info:
  title: Assessment Administration API
  description: |
    API for managing assessment questions, domains, and system administration in the MentorMe platform.
    
    ## Overview
    This API provides endpoints for administrators to manage the assessment system with the following key features:
    - **Question Management**: CRUD operations for assessment questions with approval workflow
    - **Domain Management**: Domain configuration and statistics tracking
    - **Bulk Operations**: Efficient batch processing of questions
    - **Availability Control**: Platform and school-level question availability management
    - **Admin Security**: Robust authentication and authorization for administrative access
    
    ## Authentication
    All endpoints require admin authentication with either:
    - Session-based authentication with admin role user
    - Admin password parameter (`admin_password=BIGSURF55`) for API access
    
    ## Question Lifecycle
    1. **Creation**: `POST /questions` - Create new question (requires approval)
    2. **Review**: `GET /questions` - List questions with filtering and pagination
    3. **Approval**: `POST /questions/:id/approve` - Approve/reject questions
    4. **Management**: `PUT /questions/:id` - Update question content
    5. **Availability**: `PUT /questions/:id/availability` - Control school-level availability
    6. **Cleanup**: `DELETE /questions/:id` - Remove questions if needed
    
    ## Security Features
    - Admin role validation on all endpoints
    - Comprehensive input validation and sanitization
    - Audit trail for all question modifications
    - Bulk operation safeguards
    
  version: 1.0.0
  contact:
    name: MentorMe API Support
    email: api@mentorme.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/admin
    description: Assessment Administration API base path

security:
  - sessionAuth: []
  - adminPassword: []

tags:
  - name: Question Management
    description: CRUD operations for assessment questions
  - name: Question Approval
    description: Question approval workflow and bulk operations
  - name: Domain Management
    description: Assessment domain configuration and statistics
  - name: Availability Control
    description: School-level question availability management

paths:
  /questions:
    get:
      tags:
        - Question Management
      summary: List Assessment Questions
      description: |
        Retrieves assessment questions with advanced filtering, pagination, and search capabilities.
        
        **Key Features:**
        - Pagination support with configurable page size
        - Domain-based filtering for targeted question management
        - Difficulty level filtering (1-6 levels)
        - Approval status filtering for workflow management
        - Search functionality across question text and metadata
        - Complete question metadata including approval status and statistics
        
        **Response Format:**
        Returns paginated list with complete question metadata including domain names, creator information, and performance statistics.
      operationId: listQuestions
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Number of questions per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: domain
          in: query
          description: Filter by domain name
          required: false
          schema:
            type: string
          example: "Child Safety & Supervision"
        - name: difficulty
          in: query
          description: Filter by difficulty level
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 6
          example: 3
        - name: isApproved
          in: query
          description: Filter by approval status
          required: false
          schema:
            type: boolean
          example: true
        - name: isEnabled
          in: query
          description: Filter by enabled status
          required: false
          schema:
            type: boolean
          example: true
        - name: search
          in: query
          description: Search in question text and explanation
          required: false
          schema:
            type: string
          example: "safety protocols"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Questions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestionsResponse'
              example:
                success: true
                data:
                  questions:
                    - id: "safety-3-001"
                      domainId: "Child Safety & Supervision"
                      text: "What is the appropriate adult-to-child ratio for toddlers during outdoor play?"
                      options: ["1:4", "1:6", "1:8", "1:10"]
                      correctAnswer: 0
                      difficulty: 3
                      explanation: "Toddlers require closer supervision due to their developmental stage."
                      miniLesson: "Understanding supervision ratios ensures child safety..."
                      tags: ["supervision", "ratios", "outdoor-play"]
                      isApproved: true
                      isEnabled: true
                      createdAt: "2025-01-15T10:30:00.000Z"
                      updatedAt: "2025-01-15T10:30:00.000Z"
                      domainName: "Child Safety & Supervision"
                      createdByName: "Admin User"
                      approvedByName: "Supervisor User"
                      totalResponses: 145
                      correctRate: 0.78
                  pagination:
                    page: 1
                    limit: 20
                    total: 156
                    pages: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Question Management
      summary: Create New Question
      description: |
        Creates a new assessment question with comprehensive validation and approval workflow.
        
        **Creation Process:**
        - Validates all question data including domain references
        - Ensures correct answer index is within options range
        - Checks for unique question ID across system
        - Sets initial approval status to false (requires review)
        - Enables question by default but requires approval for use
        
        **Validation Rules:**
        - Question ID must be unique across all questions
        - Domain ID must reference existing active domain
        - Options array must contain 2-6 answer choices
        - Correct answer index must be valid for options array
        - Difficulty must be between 1-6 (Easy to Master)
        - Question text must be 10-500 characters
        
        **Post-Creation:**
        Question is created in unapproved state and requires admin approval before appearing in assessments.
      operationId: createQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
            example:
              id: "safety-4-015"
              domainId: "Child Safety & Supervision"
              text: "In an emergency evacuation, what is the first priority for early childhood educators?"
              options: ["Gather personal belongings", "Account for all children", "Call parents", "Lock the building"]
              correctAnswer: 1
              difficulty: 4
              explanation: "Ensuring all children are safely accounted for is the highest priority during any emergency."
              miniLesson: "Emergency procedures focus on child safety first..."
              tags: ["emergency", "evacuation", "safety-protocols"]
      responses:
        '201':
          description: Question created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
              example:
                success: true
                data:
                  id: "safety-4-015"
                  domainId: "Child Safety & Supervision"
                  text: "In an emergency evacuation, what is the first priority for early childhood educators?"
                  options: ["Gather personal belongings", "Account for all children", "Call parents", "Lock the building"]
                  correctAnswer: 1
                  difficulty: 4
                  explanation: "Ensuring all children are safely accounted for is the highest priority during any emergency."
                  miniLesson: "Emergency procedures focus on child safety first..."
                  tags: ["emergency", "evacuation", "safety-protocols"]
                  createdBy: 12
                  isApproved: false
                  isEnabled: true
                  createdAt: "2025-01-15T10:30:00.000Z"
                  updatedAt: "2025-01-15T10:30:00.000Z"
                message: "Question created successfully"
        '400':
          description: Validation error or invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                error: "Validation error"
                details:
                  - message: "Correct answer index is out of range for provided options"
                    path: ["correctAnswer"]
        '409':
          description: Question ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Question with this ID already exists"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/{questionId}:
    get:
      tags:
        - Question Management
      summary: Get Question Details
      description: |
        Retrieves complete details for a specific assessment question including metadata and statistics.
        
        **Information Included:**
        - Complete question content and configuration
        - Domain association and metadata
        - Approval status and workflow history
        - Creator and approver information
        - Performance statistics (response count, correct rate)
        - Availability settings across schools
      operationId: getQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Question details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Question not found"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Question Management
      summary: Update Question
      description: |
        Updates an existing assessment question with comprehensive validation.
        
        **Update Process:**
        - Validates all modified fields
        - Maintains referential integrity with domains
        - Preserves approval status unless explicitly changed
        - Updates modification timestamp and user tracking
        - Handles partial updates (only specified fields changed)
        
        **Approval Impact:**
        If question content is significantly modified, the approval status may be reset requiring re-approval.
      operationId: updateQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionRequest'
            example:
              text: "What is the appropriate adult-to-child ratio for toddlers during outdoor play activities?"
              explanation: "Toddlers require closer supervision due to their developmental stage and increased mobility."
              difficulty: 4
              tags: ["supervision", "ratios", "outdoor-play", "toddlers"]
      responses:
        '200':
          description: Question updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
              example:
                success: true
                data:
                  id: "safety-3-001"
                  domainId: "Child Safety & Supervision"
                  text: "What is the appropriate adult-to-child ratio for toddlers during outdoor play activities?"
                  options: ["1:4", "1:6", "1:8", "1:10"]
                  correctAnswer: 0
                  difficulty: 4
                  explanation: "Toddlers require closer supervision due to their developmental stage and increased mobility."
                  tags: ["supervision", "ratios", "outdoor-play", "toddlers"]
                  isApproved: true
                  isEnabled: true
                  updatedAt: "2025-01-15T11:45:00.000Z"
                message: "Question updated successfully"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Question Management
      summary: Delete Question
      description: |
        Permanently removes an assessment question from the system.
        
        **Deletion Safeguards:**
        - Checks for existing assessment responses
        - Validates admin permissions for deletion
        - Logs deletion action for audit trail
        - Cannot be undone once completed
        
        **Warning:**
        This operation permanently removes the question and cannot be reversed. Use with caution.
      operationId: deleteQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier to delete
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Question deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Question deleted successfully"
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/{questionId}/approve:
    post:
      tags:
        - Question Approval
      summary: Approve or Reject Question
      description: |
        Updates the approval status of an assessment question in the review workflow.
        
        **Approval Process:**
        - Admin reviews question content and quality
        - Approval enables question for use in assessments
        - Rejection prevents question from appearing in assessments
        - Tracks approval user and timestamp for audit trail
        
        **Impact:**
        - Approved questions become available for adaptive assessment selection
        - Rejected questions remain in system but are excluded from assessments
        - Approval status can be changed multiple times if needed
      operationId: approveQuestion
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isApproved
              properties:
                isApproved:
                  type: boolean
                  description: Whether to approve or reject the question
                  example: true
      responses:
        '200':
          description: Question approval status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
              example:
                success: true
                data:
                  id: "safety-3-001"
                  isApproved: true
                  approvedBy: 15
                  updatedAt: "2025-01-15T11:45:00.000Z"
                message: "Question approved successfully"
        '400':
          description: Invalid approval status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "isApproved must be a boolean value"
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/{questionId}/availability:
    put:
      tags:
        - Availability Control
      summary: Update Question Availability
      description: |
        Controls question availability at platform or school level for fine-grained access management.
        
        **Availability Levels:**
        - **Platform Level**: Controls global question availability (schoolId = null)
        - **School Level**: Controls availability for specific schools
        - **Cascading Logic**: School settings override platform settings
        
        **Use Cases:**
        - Disable problematic questions globally
        - Enable pilot questions for specific schools
        - Regional compliance requirements
        - Gradual question rollout strategies
      operationId: updateQuestionAvailability
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Unique question identifier
          schema:
            type: string
          example: "safety-3-001"
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isEnabled
              properties:
                isEnabled:
                  type: boolean
                  description: Whether question is available for use
                  example: true
                schoolId:
                  type: integer
                  nullable: true
                  description: School ID for school-specific availability (null for platform-wide)
                  example: 12
      responses:
        '200':
          description: Question availability updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      questionId:
                        type: string
                        example: "safety-3-001"
                      schoolId:
                        type: integer
                        nullable: true
                        example: 12
                      isEnabled:
                        type: boolean
                        example: true
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2025-01-15T11:45:00.000Z"
                  message:
                    type: string
                    example: "Question availability updated successfully"
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/bulk/approve:
    post:
      tags:
        - Question Approval
      summary: Bulk Approve Questions
      description: |
        Efficiently approves multiple questions in a single operation for streamlined workflow management.
        
        **Bulk Processing:**
        - Processes up to 100 questions per request
        - Validates each question ID before processing
        - Atomic operation - all questions processed or none
        - Returns count of successfully updated questions
        - Comprehensive error handling for partial failures
        
        **Performance:**
        Optimized for high-volume approval workflows with database transactions and batch processing.
      operationId: bulkApproveQuestions
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionIds
              properties:
                questionIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Array of question IDs to approve
                  example: ["safety-3-001", "safety-3-002", "health-2-015"]
      responses:
        '200':
          description: Questions approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updatedCount:
                        type: integer
                        description: Number of questions successfully approved
                        example: 3
                  message:
                    type: string
                    example: "3 questions approved successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "questionIds must be a non-empty array"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /questions/bulk/availability:
    post:
      tags:
        - Availability Control
      summary: Bulk Update Question Availability
      description: |
        Updates availability status for multiple questions simultaneously for efficient system management.
        
        **Bulk Availability Management:**
        - Process up to 100 questions per request
        - Apply consistent availability settings across question sets
        - Support both platform-wide and school-specific updates
        - Atomic transaction processing for data consistency
        
        **Use Cases:**
        - Seasonal question activation/deactivation
        - Regional compliance updates
        - Emergency question disabling
        - Pilot program management
      operationId: bulkUpdateAvailability
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionIds
                - isEnabled
              properties:
                questionIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Array of question IDs to update
                  example: ["safety-3-001", "safety-3-002", "health-2-015"]
                isEnabled:
                  type: boolean
                  description: Whether questions should be enabled
                  example: true
                schoolId:
                  type: integer
                  nullable: true
                  description: School ID for school-specific updates (null for platform-wide)
                  example: 12
      responses:
        '200':
          description: Question availability updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updatedCount:
                        type: integer
                        description: Number of questions successfully updated
                        example: 3
                  message:
                    type: string
                    example: "3 questions availability updated successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /domains:
    get:
      tags:
        - Domain Management
      summary: Get Assessment Domains
      description: |
        Retrieves all active assessment domains used for question categorization and weighted selection.
        
        **Domain Information:**
        - Complete domain metadata and descriptions
        - Question weight configurations for adaptive assessment
        - Display ordering for UI presentation
        - Domain activation status
        
        **Usage:**
        Used by question management interfaces and assessment configuration systems.
      operationId: getDomains
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Domains retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssessmentDomain'
                    example:
                      - id: 1
                        name: "Child Safety & Supervision"
                        description: "Active supervision, incident response, hygiene, emergency plans"
                        questionWeight: 10
                        displayOrder: 1
                        isActive: true
                        createdAt: "2025-01-15T10:00:00.000Z"
                        updatedAt: "2025-01-15T10:00:00.000Z"
                      - id: 2
                        name: "Health & Development"
                        description: "Developmental milestones, nutrition, sleep, red flags"
                        questionWeight: 8
                        displayOrder: 2
                        isActive: true
                        createdAt: "2025-01-15T10:00:00.000Z"
                        updatedAt: "2025-01-15T10:00:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /domains/statistics:
    get:
      tags:
        - Domain Management
      summary: Get Domain Statistics
      description: |
        Retrieves comprehensive statistics for assessment domains including question counts and approval metrics.
        
        **Statistics Included:**
        - Total questions per domain
        - Approved questions count
        - Approval percentage rates
        - Domain configuration metadata
        
        **Use Cases:**
        - Content gap analysis
        - Quality assurance monitoring
        - Domain balance assessment
        - Content planning and strategy
      operationId: getDomainStatistics
      security:
        - sessionAuth: []
        - adminPassword: []
      parameters:
        - name: admin_password
          in: query
          description: Admin password for API access
          required: false
          schema:
            type: string
            default: BIGSURF55
      responses:
        '200':
          description: Domain statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/AssessmentDomain'
                        - type: object
                          properties:
                            questionCount:
                              type: integer
                              description: Total questions in this domain
                              example: 45
                            approvedCount:
                              type: integer
                              description: Number of approved questions
                              example: 38
                    example:
                      - id: 1
                        name: "Child Safety & Supervision"
                        description: "Active supervision, incident response, hygiene, emergency plans"
                        questionWeight: 10
                        displayOrder: 1
                        isActive: true
                        questionCount: 45
                        approvedCount: 38
                      - id: 2
                        name: "Health & Development"
                        description: "Developmental milestones, nutrition, sleep, red flags"
                        questionWeight: 8
                        displayOrder: 2
                        isActive: true
                        questionCount: 32
                        approvedCount: 29
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session-based authentication cookie
    adminPassword:
      type: apiKey
      in: query
      name: admin_password
      description: Admin password for API access

  schemas:
    AssessmentDomain:
      type: object
      properties:
        id:
          type: integer
          description: Unique domain identifier
          example: 1
        name:
          type: string
          description: Domain name
          example: "Child Safety & Supervision"
        description:
          type: string
          description: Domain description
          example: "Active supervision, incident response, hygiene, emergency plans"
        questionWeight:
          type: integer
          description: Relative weight for question selection
          example: 10
        displayOrder:
          type: integer
          description: Order for display purposes
          example: 1
        isActive:
          type: boolean
          description: Whether domain is active
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-01-15T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-01-15T10:00:00.000Z"

    AssessmentQuestion:
      type: object
      properties:
        id:
          type: string
          description: Unique question identifier
          example: "safety-3-001"
        domainId:
          type: string
          description: Associated domain name
          example: "Child Safety & Supervision"
        text:
          type: string
          description: Question text
          example: "What is the appropriate adult-to-child ratio for toddlers?"
        options:
          type: array
          items:
            type: string
          description: Answer options
          example: ["1:4", "1:6", "1:8", "1:10"]
        correctAnswer:
          type: integer
          description: Index of correct answer (0-based)
          example: 0
        difficulty:
          type: integer
          minimum: 1
          maximum: 6
          description: Difficulty level (1=Easy, 6=Master)
          example: 3
        explanation:
          type: string
          nullable: true
          description: Explanation for correct answer
          example: "Toddlers require closer supervision due to their developmental stage."
        miniLesson:
          type: string
          nullable: true
          description: Educational content for this topic
          example: "Understanding supervision ratios ensures child safety..."
        tags:
          type: array
          items:
            type: string
          nullable: true
          description: Additional categorization tags
          example: ["supervision", "ratios", "outdoor-play"]
        createdBy:
          type: integer
          nullable: true
          description: User ID who created the question
          example: 12
        approvedBy:
          type: integer
          nullable: true
          description: User ID who approved the question
          example: 15
        isApproved:
          type: boolean
          description: Whether question is approved for use
          example: true
        isEnabled:
          type: boolean
          description: Whether question is enabled
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-01-15T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-01-15T10:30:00.000Z"
        domainName:
          type: string
          nullable: true
          description: Human-readable domain name
          example: "Child Safety & Supervision"
        createdByName:
          type: string
          nullable: true
          description: Name of user who created the question
          example: "Admin User"
        approvedByName:
          type: string
          nullable: true
          description: Name of user who approved the question
          example: "Supervisor User"
        totalResponses:
          type: integer
          nullable: true
          description: Total number of responses to this question
          example: 145
        correctRate:
          type: number
          format: float
          nullable: true
          description: Percentage of correct responses (0.0-1.0)
          example: 0.78

    CreateQuestionRequest:
      type: object
      required:
        - id
        - domainId
        - text
        - options
        - correctAnswer
        - difficulty
      properties:
        id:
          type: string
          description: Unique question identifier
          example: "safety-4-015"
        domainId:
          type: string
          description: Domain name for categorization
          example: "Child Safety & Supervision"
        text:
          type: string
          minLength: 10
          maxLength: 500
          description: Question text
          example: "In an emergency evacuation, what is the first priority?"
        options:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 6
          description: Answer options
          example: ["Gather belongings", "Account for all children", "Call parents", "Lock building"]
        correctAnswer:
          type: integer
          minimum: 0
          description: Index of correct answer (0-based)
          example: 1
        difficulty:
          type: integer
          minimum: 1
          maximum: 6
          description: Difficulty level (1=Easy, 6=Master)
          example: 4
        explanation:
          type: string
          nullable: true
          description: Explanation for correct answer
          example: "Child safety is always the highest priority during emergencies."
        miniLesson:
          type: string
          nullable: true
          description: Educational content for this topic
          example: "Emergency procedures focus on child safety first..."
        tags:
          type: array
          items:
            type: string
          nullable: true
          description: Additional categorization tags
          example: ["emergency", "evacuation", "safety-protocols"]

    UpdateQuestionRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 10
          maxLength: 500
          description: Updated question text
        options:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 6
          description: Updated answer options
        correctAnswer:
          type: integer
          minimum: 0
          description: Updated correct answer index
        difficulty:
          type: integer
          minimum: 1
          maximum: 6
          description: Updated difficulty level
        explanation:
          type: string
          nullable: true
          description: Updated explanation
        miniLesson:
          type: string
          nullable: true
          description: Updated educational content
        tags:
          type: array
          items:
            type: string
          nullable: true
          description: Updated tags

    PaginatedQuestionsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            questions:
              type: array
              items:
                $ref: '#/components/schemas/AssessmentQuestion'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  description: Current page number
                  example: 1
                limit:
                  type: integer
                  description: Items per page
                  example: 20
                total:
                  type: integer
                  description: Total number of questions
                  example: 156
                pages:
                  type: integer
                  description: Total number of pages
                  example: 8

    QuestionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AssessmentQuestion'
        message:
          type: string
          example: "Question retrieved successfully"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
          example: "Operation failed"

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation error"
        details:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: Validation error message
              path:
                type: array
                items:
                  type: string
                description: Path to the invalid field

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Unauthorized"

    AdminRequired:
      description: Admin privileges required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Admin access required"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Internal server error" 